<line x1="415" y1="165" x2="437" y2="165" stroke="#bfb5a5"/><text x="447" y="170" font-family="monospace" font-size="17" fill="#262522">d09 → [1]</text>
<line x1="415" y1="211" x2="437" y2="211" stroke="#bfb5a5"/><text x="447" y="216" font-family="monospace" font-size="17" fill="#262522">d10 → [1]</text>
<line x1="735" y1="30" x2="735" y2="330" stroke="#d3c9bb"/>
