[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "positional-search-index-lab"
version = "1.0.0"
description = "Unicode-aware positional query evidence and explainable BM25"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
