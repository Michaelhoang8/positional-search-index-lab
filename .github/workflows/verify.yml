name: Verify positional search and evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_study.py --out outputs/ci
      - run: python scripts/run_scale.py --out outputs/scale-ci
      - run: python scripts/verify_reproduction.py outputs/ci results/published
      - run: python scripts/verify_reproduction.py outputs/scale-ci results/scale
      - name: Published evidence remains unchanged
        run: git diff --exit-code -- results docs
